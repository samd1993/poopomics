# Everything on the site that changes week to week. Edit this, then run:
#     python3 build_site.py            # preview build
#     python3 build_site.py --site     # the deployable site/ folder
#
# A news item needs: title, note. Optional: url, meta, date, people (names that get
# a face), portrait (one name, shown large), pic (kind: img|svg|photo, ref: path or
# credit key), flip: true to put the picture on the right.
#
# Figure captions and the project write-ups still live in build_site.py, beside the
# figures they describe.

