# Netlify builds the site from this repo on every push to master.
#
# The figure SVGs and the face crops are committed, so the deploy build only has to assemble the
# page — no matplotlib, no OpenCV, no source photography. It needs Python with PyYAML (content)
# and Pillow (measures the face-band strips).

[build]
  command = "pip install pyyaml pillow && cd build && python3 build_site.py --site"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

# The pages are one document with hash routing, so anything that is not a real file is the page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames change whenever their contents do, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
